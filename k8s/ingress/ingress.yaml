apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-monitor-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
  - host: uptime.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: uptime-monitor-backend-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uptime-monitor-frontend-svc
            port:
              number: 80
