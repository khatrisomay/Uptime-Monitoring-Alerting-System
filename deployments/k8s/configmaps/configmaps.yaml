apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: uptime-monitor-backend
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "*"
  DEFAULT_PING_TIMEOUT: "5.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: uptime-monitor-frontend
data:
  VITE_API_BASE_URL: "http://uptime-monitor-backend-svc:8000"
  VITE_ENABLE_ANALYTICS: "true"
